schema_version: "1.0"

name: Adverse-Action Reason Source-to-Notice Traceability and Reconciliation

applied_definition: |
  A qualitative, record-level reconciliation method for AI- or
  machine-learning-assisted credit decision systems. For each recorded adverse
  decision, the method evaluates a declared chain consisting of the final
  decision component; adverse source-driver contributions; the reason-selection
  method; governed reason-code mappings; recorded reason outputs; the applicable
  underwriting policy and notice-template versions; and visible reason segments
  in the rendered notice record.

  The method emits named exceptions when one or more of these invariants fail:

  1. the final decision component and, for a combined decision, its failed source
     components are recorded;
  2. each output driver is an adverse contributor in an eligible recorded source
     component, and its recorded rank matches deterministic ranking under the
     declared convention;
  3. mapped principal source drivers within the predeclared review limit are not
     omitted;
  4. each output pins the applicable mapping identifier, mapping version,
     mapping effective date, policy version, selection-method identifier and
     version, and notice-template identifier and version;
  5. the disclosed reason text reconciles to the controlled mapped text after
     case and whitespace normalization; and
  6. each visible rendered-notice reason segment reconciles to one recorded
     reason output by identifier, code, text, and template version.

  Results are reported as coverage plus counts and rates by exception type; the
  method does not collapse distinct failures into a weighted composite score. A
  clean result means that the supplied records are internally consistent with
  the declared and versioned convention. It does not establish that the records
  are truthful, that the underlying explanation is faithful or causal, that the
  selected drivers are uniquely principal, that the language is meaningful to
  a recipient, or that a notice is legally sufficient.

