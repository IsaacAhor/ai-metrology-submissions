schema_version: "1.0"

name: Adverse-Action Reason Source-to-Notice Traceability and Reconciliation

applied_definition: |
  A qualitative, record-level process-conformance method for AI- or
  machine-learning-assisted credit decision systems. For each recorded declined
  decision, it tests whether a declared and versioned chain remains internally
  consistent from the final decision and adverse source-driver contributions
  through deterministic reason selection, governed reason-code mappings,
  recorded reason outputs, and visible notice segments. It emits a named
  exception for each failed chain invariant rather than a weighted composite
  score. Results report execution status for source-to-reason and rendered-notice
  checks, total exception count, exception types, and record-level details. A
  result is clean only when every applicable check ran and emitted no exception;
  clean means only that the supplied records conform to the declared chain, not
  that they are truthful, causally faithful, legally sufficient, or understandable
  to a recipient.

submitter_organizations:
