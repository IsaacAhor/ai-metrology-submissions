object_of_measurement:
  - system

model_specificity: model agnostic

domain_specificity: domain specific — credit underwriting and adverse-action reason records

usage_details: |
  Apply the method during predeployment review, material-change review, and
  periodic monitoring when a credit decision system produces reason outputs and
  a separate notice-rendering process. The evaluator supplies versioned records
  for the decision path, source drivers, mappings, policies, selection methods,
  output reasons, templates, and rendered reason segments. The method is most
  useful as a reproducible provenance and change-control check alongside, not in
  place of, an explanation-method evaluation and human review of recipient-facing
  language.

known_failure_modes: |
  Internally consistent but false, incomplete, or post hoc records can pass. A
  deterministic ranking can reproduce the declared convention while the
  convention itself is unsuitable. Text normalization detects controlled-text
  drift but not semantic ambiguity, readability, or recipient understanding.
  Missing production context, human review, or representative field data limits
  external validity. The reference implementation uses synthetic data and is not
  evidence of production effectiveness or institutional adoption.

modality:
  - structured data
  - text

